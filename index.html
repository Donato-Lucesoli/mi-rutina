<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="apple-touch-icon" href="icon.png">
<title>Mi registro de gimnasio</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mut:#5d6b78;--line:#d5dbe1;--acc:#1f5fbf;--acc2:#e8f0fc;--ok:#1b7f4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#18222c;--ink:#e8edf2;--mut:#93a1ae;--line:#2b3946;--acc:#6aa5ff;--acc2:#1d2e45;--ok:#5fd193}}
:root[data-theme="dark"]{--bg:#10171e;--card:#18222c;--ink:#e8edf2;--mut:#93a1ae;--line:#2b3946;--acc:#6aa5ff;--acc2:#1d2e45;--ok:#5fd193}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",Arial,sans-serif;line-height:1.45}
main{max-width:860px;margin:0 auto;padding:16px}
h3{margin:16px 0 4px}.ct{min-width:0;margin-bottom:8px}
.bar{position:sticky;bottom:0;background:var(--card);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.blk{border-bottom:1px solid var(--line);padding:10px 0}.blk:last-of-type{border:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}.row input[type=text]{width:110px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}.card h3{margin:0 0 8px}.card h4{margin:12px 0 2px}.card ul{padding-left:20px;margin:4px 0}.card li{margin-bottom:5px}
h1{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:2rem;margin:8px 0 12px;letter-spacing:.3px}
.tabs,.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--mut);font-size:.85rem}
td input{width:64px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.last{color:var(--mut);font-size:.85rem}
.save{padding:6px 10px;background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.save.done{background:var(--ok);border-color:var(--ok);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-size:1.5rem;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
.stat span{color:var(--mut);font-size:.85rem}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
svg{width:100%;height:auto;display:block}
.cardio li{margin-bottom:6px}
.empty{color:var(--mut)}
.small{font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>Mi registro de gimnasio</h1>
<div class="tabs" role="tablist">
  <button id="t1" class="on" onclick="tab(1)">Rutina</button>
  <button id="t2" onclick="tab(2)">Estadísticas</button>
</div>

<section id="s1">
  <div class="days" id="days"></div>
  <div class="card scroll" id="routine"></div>
</section>

<section id="s2" hidden>
  <div class="card">
    <label for="exSel" class="small">Ejercicio</label><br>
    <select id="exSel" onchange="stats()"></select>
  </div>
  <div class="grid" id="cards"></div>
  <div class="card"><div id="chart"></div></div>
  <div class="card scroll"><div id="hist"></div></div>
  <button onclick="resetAll()">Borrar todos los registros</button>
</section>
</main>

<script>
const R={
"Tren inf":[["Sentadilla libre (pesada)",3,"4-6"],["Peso muerto (moderado)",3,"8-12"],["Saltos a una pierna",3,"10"],["Zancadas con disco (ida y vuelta)",3,"10"],["Zancadas laterales con disco",3,"12"],["Zancadas rusas (concentradas)",3,"20 s"],["Gemelos (ligero)",3,"15-20"],["Tibial",3,"15-20"]],
"Tren sup":[["Press con mancuernas (alternando)",3,"8-12"],["Remo unilateral",3,"8-12"],["Press militar con mancuernas (arrollida y dinámica)",3,"8-12"],["Chin ups + 5 segundos",3,"4-6"],["Press francés",3,"8-12"],["Elevaciones laterales",3,"8-12"],["Crunches con disco",3,"8-12"],["Disco lado a lado",3,"8-12"],["Leg raises",3,"15-20"]]
};
const CARDIO=[
{t:"Martes: Zona 2 trotando (35-45 min)",d:"Trote continuo a ritmo conversacional. Es la base aeróbica de todo lo demás. Si te falta el aire para hablar, baja la velocidad.",rows:[["Entrada en calor, 5 min","6-7 km/h","0-1%"],["Trote continuo, 30-35 min","9-10.5 km/h","1%"],["Vuelta a la calma, 5 min","5-6 km/h","0%"]]},
{t:"Jueves: intervalos de alta intensidad (25-30 min)",d:"Esfuerzo de 8-9 sobre 10 en cada ronda fuerte, parecido a los arranques del básquet. Termina con una ronda de reserva: el viernes juegas.",rows:[["Entrada en calor, 6 min","6-8 km/h","0-1%"],["Fuerte, 45 s (8 rondas)","13-15 km/h","1%"],["Recuperación, 75 s trotando suave","6.5-7.5 km/h","0%"],["Vuelta a la calma, 5 min","5-6 km/h","0%"]]},
{t:"Domingo: cuestas o carrera larga (30-40 min)",d:"Alterna cada semana. Cuestas: 6 rondas de 1 min a 9-10 km/h con 6-8% de inclinación, y 2 min caminando a 5 km/h. Carrera larga: trote suave y constante a 9-10 km/h.",rows:[["Entrada en calor, 5 min","6-7 km/h","1%"],["Cuestas, 6 rondas","9-10 km/h","6-8%"],["Recuperación, 2 min","5 km/h","0%"],["Vuelta a la calma, 5 min","5 km/h","0%"]]},
{t:"Progresión sugerida (4 semanas)",d:"Sube la exigencia de a poco para no lesionarte al empezar el hábito.",rows:[["Semana 1","Martes 30 min, jueves 6 rondas",""],["Semana 2","Martes 35 min, jueves 7 rondas",""],["Semana 3","Martes 40 min, jueves 8 rondas",""],["Semana 4","Martes 45 min, jueves 8 rondas más rápidas (+0.5 km/h)",""]]}
];
const CARDIO_TIPS=["Estos rangos son de partida: ajusta según tu ritmo. Si no llegas a 13 km/h en los intervalos, usa la velocidad más alta que puedas sostener las 8 rondas.","Sube 0.5 km/h por semana cuando una sesión te resulte fácil.","El lunes es pesado de piernas: si llegas muy cargado al martes, empieza con 30 min y baja la velocidad 0.5-1 km/h.","Cuida las zapatillas y aumenta el volumen de a poco: es lo que más evita lesiones en rodillas y espinillas.","El día antes del básquet (jueves) deja siempre algo de energía."];
const KEY="gymlog_v1",PK="gymplan_v1";
let plan={};
try{plan=JSON.parse(localStorage.getItem(PK)||"{}")}catch(e){plan={}}
function pl(e){return plan[e[0]]||{s:e[1],r:e[2]}}
function setPlan(i,k,v){const e=R[day][i],c=pl(e);plan[e[0]]={s:c.s,r:c.r};plan[e[0]][k]=k==="s"?(parseInt(v)||c.s):v;try{localStorage.setItem(PK,JSON.stringify(plan))}catch(x){}}
let log=[],day="Tren inf";
try{log=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){log=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(log))}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function last(ex){const l=log.filter(x=>x.ex===ex);return l[l.length-1]}
function tab(n){s1.hidden=n!==1;s2.hidden=n!==2;t1.className=n===1?"on":"";t2.className=n===2?"on":"";if(n===2)stats();}
function drawDays(){
  days.innerHTML=[...Object.keys(R),"Cardio","Básquet"].map(d=>`<button class="${d===day?"on":""}" onclick="setDay('${d}')">${d}</button>`).join("");
}
function setDay(d){day=d;drawDays();drawRoutine()}
function drawRoutine(){
  if(day==="Básquet"){routine.innerHTML=basketHTML();return}
  if(day==="Cardio"){
    routine.innerHTML=`<p class="small">Miércoles y viernes juegas básquet, por eso el cardio va martes y jueves. Está armado para correr, con nivel exigente y progresivo porque quieres mejorar tu rendimiento.</p>`+
    CARDIO.map(c=>`<h3>${c.t}</h3><p>${c.d}</p>`+(c.rows.length?`<table class="ct"><thead><tr><th>Fase</th><th>Velocidad</th><th>Inclinación</th></tr></thead><tbody>`+c.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")+`</tbody></table>`:"")).join("")+
    `<h3>Consejos</h3><ul class="cardio">`+CARDIO_TIPS.map(x=>`<li>${x}</li>`).join("")+`</ul>`;return;
  }
  routine.innerHTML=`<table><thead><tr><th>Ejercicio</th><th>Series (meta)</th><th>Reps (meta)</th><th>Peso (kg)</th><th>Series hechas</th><th>Reps hechas</th></tr></thead><tbody>`+
  R[day].map((e,i)=>{const l=last(e[0]);return `<tr><td>${esc(e[0])}<div class="last">${l?`Último: ${l.w} kg, ${l.s}x${l.r} (${l.d})`:"Sin registros"}</div></td><td><input type="number" min="1" inputmode="numeric" value="${pl(e).s}" onchange="setPlan(${i},'s',this.value)" aria-label="Series objetivo"></td><td><input type="text" value="${pl(e).r}" onchange="setPlan(${i},'r',this.value)" aria-label="Reps objetivo"></td>
  <td><input id="w${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="${l?l.w:""}" value="${dv(e,'w')}" oninput="dr(${i},'w',this.value)" aria-label="Peso"></td>
  <td><input id="s${i}" type="text" inputmode="numeric" autocomplete="off" value="${dv(e,'s',pl(e).s)}" oninput="dr(${i},'s',this.value)" aria-label="Series hechas"></td>
  <td><input id="r${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="${l?l.r:""}" value="${dv(e,'r')}" oninput="dr(${i},'r',this.value)" aria-label="Reps hechas"></td>
  </tr>`}).join("")+`</tbody></table><div class="bar"><button class="on" onclick="saveAll()">Guardar todo</button><span id="msg" class="small"></span></div>`;
}
let drafts={};
function dv(e,k,d){const x=drafts[e[0]];return x&&x[k]!==undefined?x[k]:(d===undefined?"":d)}
function dr(i,k,v){const n=R[day][i][0];(drafts[n]=drafts[n]||{})[k]=v}
function num(x){return parseFloat(String(x).replace(",",".").trim())}
function today(){const d=new Date(),z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function saveAll(){
  const add=[],bad=[],skipped=[];
  R[day].forEach((e,i)=>{
    const w=document.getElementById("w"+i).value.trim(),s=document.getElementById("s"+i).value,r=document.getElementById("r"+i).value.trim();
    if(w===""&&r==="")return;
    const rr=num(r),ww=w===""?0:num(w),ss=num(s);
    if(isNaN(rr)||isNaN(ww)){bad.push(e[0]);return}
    add.push({ex:e[0],d:today(),w:ww,s:isNaN(ss)?pl(e).s:ss,r:rr});
    delete drafts[e[0]];
  });
  log.push(...add);persist();drawRoutine();
  const m=document.getElementById("msg");
  m.textContent=(add.length?"Guardados "+add.length+" ejercicios. ":"No había nada para guardar. ")+(bad.length?"Revisa peso y reps de: "+bad.join(", ")+".":"");
}
function allEx(){return[...R["Tren inf"],...R["Tren sup"]].map(e=>e[0])}
function stats(){
  const cur=exSel.value||allEx()[0];
  exSel.innerHTML=allEx().map(e=>`<option ${e===cur?"selected":""}>${esc(e)}</option>`).join("");
  const l=log.filter(x=>x.ex===exSel.value);
  if(!l.length){cards.innerHTML="";chart.innerHTML='<p class="empty">Todavía no hay registros de este ejercicio. Guarda uno en la pestaña Rutina.</p>';hist.innerHTML="";return}
  const max=Math.max(...l.map(x=>x.w)),vol=l.reduce((a,x)=>a+x.w*x.s*x.r,0),days_=new Set(l.map(x=>x.d)).size;
  const first=l[0].w,lastW=l[l.length-1].w,diff=lastW-first;
  cards.innerHTML=[[max+" kg","Peso máximo"],[days_,"Días registrados"],[Math.round(vol)+" kg","Volumen total"],[(diff>=0?"+":"")+diff+" kg","Cambio desde el inicio"]].map(c=>`<div class="stat"><b>${c[0]}</b><span>${c[1]}</span></div>`).join("");
  line(l);
  hist.innerHTML=`<table><thead><tr><th>Fecha</th><th>Peso</th><th>Series</th><th>Reps</th><th></th></tr></thead><tbody>`+[...l].reverse().map(x=>`<tr><td>${x.d}</td><td>${x.w} kg</td><td>${x.s}</td><td>${x.r}</td><td><button onclick="del(${log.indexOf(x)})" aria-label="Borrar registro">Borrar</button></td></tr>`).join("")+`</tbody></table>`;
}
function line(l){
  const W=640,H=240,p=36,ws=l.map(x=>x.w),mn=Math.min(...ws),mx=Math.max(...ws),rg=(mx-mn)||1;
  const X=i=>l.length===1?W/2:p+i*(W-2*p)/(l.length-1),Y=v=>H-p-(v-mn)/rg*(H-2*p);
  const pts=l.map((x,i)=>X(i)+","+Y(x.w)).join(" ");
  chart.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso en el tiempo"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="var(--line)"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="var(--line)"/>
  <text x="4" y="${Y(mx)+4}" fill="var(--mut)" font-size="12">${mx}</text><text x="4" y="${Y(mn)+4}" fill="var(--mut)" font-size="12">${mn}</text>
  <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>`+
  l.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="4" fill="var(--acc)"/>`).join("")+
  `<text x="${p}" y="${H-10}" fill="var(--mut)" font-size="12">${l[0].d}</text><text x="${W-p}" y="${H-10}" fill="var(--mut)" font-size="12" text-anchor="end">${l[l.length-1].d}</text></svg>`;
}
function del(i){log.splice(i,1);persist();stats();drawRoutine()}
function resetAll(){if(confirm("¿Borrar todos los registros?")){log=[];persist();stats();drawRoutine()}}
const BB="bball_v1";let bb={};
try{bb=JSON.parse(localStorage.getItem(BB)||"{}")}catch(e){bb={}}
if(!bb.log)bb.log=[];
let bd={};
const TIRO=[
["fl","Floaters desde 10-15 pies (3-4.5 m)","50 hechos",
"5 posiciones (esquinas, codos y centro), 10 hechos en cada una. Salida a una mano, pelota alta y toque suave."],
["mid","Tiros dentro de la línea de 3","25 hechos","Desde media distancia. Frena balanceado y sube recto."],
["pu","Pull up en 1-2","25 hechos","Dos pasos hacia el aro, frenas en balance y tiras."],
["hop","Catch and shoot de 3 con hop","50 hechos","Pies listos antes de recibir, salto corto y caes con los dos pies a la vez."],
["s12","Catch and shoot de 3 con 1-2","50 hechos","Recibes y das dos pasos con ritmo de uno-dos antes de tirar."],
["lat","Movimientos laterales y tiro de 3 tras recibir","100 hechos","Desplázate de lado, recibe y tira de 3 sin perder la base ni la alineación al aro."],
["game","Tus tiros de partido","100 hechos","Desde las posiciones que más tiras en los partidos y a velocidad de juego."],
["ft","Tiros libres","100 hechos","Misma rutina antes de cada tiro: respira, bota, mira el aro y tira."]];
const GK="bbgoal_v1";let goals={};
try{goals=JSON.parse(localStorage.getItem(GK)||"{}")}catch(e){goals={}}
function goal(x){return goals[x[0]]!==undefined?goals[x[0]]:parseInt(x[2])}
function goalTotal(){return TIRO.reduce((a,x)=>a+goal(x),0)}
function setGoal(id,v){const n=parseInt(v);if(isNaN(n)||n<0)return;goals[id]=n;try{localStorage.setItem(GK,JSON.stringify(goals))}catch(e){}document.getElementById("bgt").textContent=goalTotal()}
function bset(k,v){bd[k]=v}
function lastBB(id){const l=bb.log.filter(x=>x.id===id);return l[l.length-1]}
function basketHTML(){
  return `<p class="small">Meta total: <b id="bgt">${goalTotal()}</b> hechos (puedes cambiar la meta de cada ejercicio). Anota cuántos intentaste y cuántos convertiste en cada ejercicio.</p><table><thead><tr><th>Ejercicio</th><th>Meta</th><th>Intentos</th><th>Hechos</th></tr></thead><tbody>`+
  TIRO.map(x=>{const l=lastBB(x[0]);
    const last=l?`Último (${l.d}): ${l.m}${l.a?"/"+l.a+" ("+Math.round(l.m/l.a*100)+"%)":""}`:"Sin registros";
    return `<tr><td>${x[1]}<div class="small">${x[3]}</div><div class="last">${last}</div></td><td><input type="text" inputmode="numeric" autocomplete="off" value="${goal(x)}" onchange="setGoal('${x[0]}',this.value)" aria-label="Meta de hechos"></td>
    <td><input id="ba${x[0]}" type="text" inputmode="numeric" autocomplete="off" value="${bd["ba"+x[0]]||""}" oninput="bset('ba${x[0]}',this.value)" aria-label="Intentos"></td>
    <td><input id="bm${x[0]}" type="text" inputmode="numeric" autocomplete="off" value="${bd["bm"+x[0]]||""}" oninput="bset('bm${x[0]}',this.value)" aria-label="Hechos"></td></tr>`}).join("")+
  `</tbody></table><div class="bar"><button class="on" onclick="saveBB()">Guardar todo</button><span id="bmsg" class="small"></span></div>`;
}
function saveBB(){
  let n=0;
  TIRO.forEach(x=>{
    const id=x[0],m=num(document.getElementById("bm"+id).value),a=num(document.getElementById("ba"+id).value);
    if(isNaN(m))return;
    bb.log.push({d:today(),id,m,a:isNaN(a)?0:a});delete bd["bm"+id];delete bd["ba"+id];n++;
  });
  try{localStorage.setItem(BB,JSON.stringify(bb))}catch(e){}
  drawRoutine();document.getElementById("bmsg").textContent=n?"Guardados "+n+" ejercicios.":"No había nada para guardar.";
}

drawDays();drawRoutine();
</script>
</body>
</html>
